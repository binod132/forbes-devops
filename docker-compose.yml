version: '3.8'
services:
  welcome-page:
    build: ./welcome-page
    ports:
      - "3001:3000"
    networks:
      - my_network

  login-page:
    build: ./login-page
    ports:
      - "3002:3000"
    networks:
      - my_network

  backend:
    build: ./backend
    ports:
      - "5001:5000"
    environment:
      DB_HOST: db
      DB_USER: user
      DB_PASSWORD: password
      DB_NAME: mydatabase
    depends_on:
      - db
    networks:
      - my_network

  db:
    image: mysql:8.0
    command: --default-authentication-plugin=mysql_native_password
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: mydatabase
      MYSQL_USER: user
      MYSQL_PASSWORD: password
    volumes:
      - ./database:/docker-entrypoint-initdb.d
    networks:
      - my_network

  nginx:
    image: nginx:latest
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf
    depends_on:
      - welcome-page
      - login-page
      - backend
    networks:
      - my_network

networks:
  my_network:
    driver: bridge
